name: Signed Mac dialog release

on:
  push:
    tags:
      - 'ikesu-mac-dialog-v*'

permissions:
  contents: write

concurrency:
  group: mac-dialog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'kazuph/ikesu'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request
          tag = os.environ['GITHUB_REF_NAME']
          if not re.fullmatch(r'ikesu-mac-dialog-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
              raise SystemExit('invalid stable release tag')
          request = urllib.request.Request('https://api.github.com/repos/kazuph/ikesu/releases/tags/' + tag,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          try:
              urllib.request.urlopen(request)
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
          else:
              raise SystemExit('existing release must never be replaced')
          PY
      - name: Build and require Developer ID signature
        env:
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: python3 scripts/package_mac_dialog.py "${GITHUB_REF_NAME#ikesu-mac-dialog-v}" release-assets
      - name: Publish complete release without changing latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s release-assets/ikesu-mac-dialog-darwin-arm64.tar.gz
          test -s release-assets/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false --title "$GITHUB_REF_NAME" \
            release-assets/ikesu-mac-dialog-darwin-arm64.tar.gz release-assets/SHA256SUMS
