id = "kazuph.mac-dialog-decisions"
name = "Mac Dialog Decisions"
version = "0.1.4"
min_ikesu_version = "0.2.7"
description = "Show pending ikesu decisions as a front-most macOS dialog with the full text (origin, question label, every option's label, description and preview, deadline); answers become `ikesu decision answer --responder mac-dialog`."
platforms = ["macos"]

[[events]]
on = "decision.created"
command = ["./ensure-daemon"]

[[actions]]
id = "start"
title = "Start the Mac dialog decisions daemon"
description = "Start the background daemon that shows pending decisions as macOS dialogs"
contexts = ["global"]
command = ["./ensure-daemon"]
