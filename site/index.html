<section class="intro">
<p class="eyebrow">A QUIET HOME FOR YOUR AGENTS</p>
<h1 data-ja="エージェントを<br>池で飼う。" data-en="Keep your agents.<br>In a pond.">エージェントを<br>池で飼う。</h1>
<p class="lead" data-ja="いくつものターミナルに、ひとつの池を。<br>働く鯉、休む鯉、あなたを待つ鯉。<br>コードが育つ時間を、穏やかに見守る。" data-en="Many terminals. One quiet pond.<br>Some koi work. Some rest. Some wait for you.<br>A calmer way to be with your coding agents.">いくつものターミナルに、ひとつの池を。<br>働く鯉、休む鯉、あなたを待つ鯉。<br>コードが育つ時間を、穏やかに見守る。</p>
<a class="link" href="https://github.com/kazuph/ikesu"><span data-ja="GitHub で見る" data-en="Explore on GitHub" style="color:inherit;margin:0">GitHub で見る</span><span aria-hidden="true">↗</span></a>
</section>
<footer><span>ikesu · terminal workspace</span><span class="hint" data-ja="池に触れてみてください。<br>鯉が、そっと寄ってきます。" data-en="Touch the water.<br>The koi will come closer.">池に触れてみてください。<br>鯉が、そっと寄ってきます。</span></footer>

function screenToPond(x,y){const aspect=width/height;const fw=[0,-7.05,-7.8];const norm=Math.hypot(...fw);fw.forEach((_,i)=>fw[i]/=norm);const up=[0,-fw[2],fw[1]];const sx=(x/width-.5)*aspect,sy=.5-y/height;const rd=[sx,fw[1]*1.35+up[1]*sy,fw[2]*1.35+up[2]*sy];const t=-6.8/rd[1];return{x:rd[0]*t,y:7.8+rd[2]*t};}
function resize(){width=innerWidth;height=Math.max(innerHeight,Math.ceil(document.querySelector('main').getBoundingClientRect().height));canvas.style.height=height+'px';const dpr=devicePixelRatio||1;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);if(gl)gl.viewport(0,0,canvas.width,canvas.height);else ctx.setTransform(dpr,0,0,dpr,0,0);paint();}
function paint(){
 if(!atlas.complete||!atlas.naturalWidth)return;
 if(gl){
  gl.uniform2f(locations.resolution,canvas.width,canvas.height);gl.uniform1f(locations.time,clock);gl.uniform1i(locations.koi,0);
  const states=[];fish.forEach((f,i)=>states.push(Math.round(f.x/.04)*.04,Math.round(f.y/.04)*.04,Math.round(f.angle/(Math.PI/4))*(Math.PI/4),.45+i*.04));gl.uniform4fv(locations['swimmers[0]'],states);
  const rings=[];for(let i=0;i<8;i++){const r=ripples[ripples.length-1-i];rings.push(r?r.x:0,r?r.y:0,r?r.start:-100)}gl.uniform3fv(locations['rings[0]'],rings);gl.drawArrays(gl.TRIANGLES,0,3);

  for(const r of ripples){const age=clock-r.start;ctx.strokeStyle='#89b8a2';ctx.beginPath();ctx.ellipse((r.x/10+.5)*width,(r.y/8+.5)*height,12+age*65,6+age*36,0,0,Math.PI*2);ctx.stroke();}
 }
}
function frame(stamp){raf=0;if(document.hidden||motion.matches)return;const dt=last?Math.min((stamp-last)/1000,.1):0;last=stamp;clock+=dt;
 // The collision radius encloses the complete 1.6 × .64 sprite at every angle.
 const separation=Math.hypot(1.6,.64)+2*.04;
 for(const f of fish){let tx,ty;if(target){tx=target.x+Math.cos(f.phase)*.6;ty=target.y+Math.sin(f.phase)*.6}else{tx=4*Math.sin(clock*.12+f.phase);ty=3.5*Math.sin(clock*.09+f.phase*2)}const dx=tx-f.x,dy=ty-f.y;const desired=Math.atan2(dy,dx);const turn=Math.atan2(Math.sin(desired-f.angle),Math.cos(desired-f.angle));f.angle=target?desired:f.angle+turn*Math.min(1,dt*1.5);const speed=Math.min(.6,Math.hypot(dx,dy)*.35)*(1-f.variety/(fish.length*2));const x=f.x+Math.cos(f.angle)*speed*dt,y=f.y+Math.sin(f.angle)*speed*dt;if(fish.every(other=>other===f||Math.hypot(x-other.x,y-other.y)>=separation)){f.x=x;f.y=y;}}

 while(ripples.length&&clock-ripples[0].start>3)ripples.shift();paint();raf=requestAnimationFrame(frame);}
function syncMotion(){cancelAnimationFrame(raf);raf=0;last=0;paint();if(!document.hidden&&!motion.matches)raf=requestAnimationFrame(frame);}
canvas.addEventListener('pointerdown',event=>{target=screenToPond(event.clientX,event.clientY+scrollY);target.x=Math.max(-4,Math.min(4,target.x));target.y=Math.max(-3,Math.min(3,target.y));ripples.push({...target,start:clock});paint();});
new ResizeObserver(resize).observe(document.querySelector('main'));addEventListener('resize',resize);document.addEventListener('visibilitychange',syncMotion);motion.addEventListener('change',syncMotion);atlas.addEventListener('load',()=>{if(gl){gl.bindTexture(gl.TEXTURE_2D,texture);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,atlas);}resize();syncMotion();});
document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{const lang=button.dataset.lang;document.documentElement.lang=lang;document.querySelectorAll('[data-ja]').forEach(element=>element.innerHTML=element.dataset[lang]);document.querySelectorAll('[data-lang]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));canvas.setAttribute('aria-label',lang==='ja'?'触れると波紋が広がる3Dの池とピクセルアートの鯉':'A 3D pond with pixel-art koi and touch ripples');document.title=lang==='ja'?'ikesu — エージェントを池で飼う':'ikesu — A quiet home for your agents';}));
